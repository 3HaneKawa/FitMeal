<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FitMeal 轻食令智能饮食推荐产品原型">
  <title>FitMeal 轻食令</title>
  <link rel="stylesheet" href="./styles.css?v=0.5.3">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="FitMeal 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img"><path d="M8.5 7.5c4.8.4 8.2 2.5 10.2 6.3 2.1 4 1.5 8-1.8 11.6-2.6-1-4.5-2.5-5.9-4.7-1.6-2.6-2.4-5.5-2.5-8.7-.1-1.7 0-3.2 0-4.5Z"/><path d="M18.2 12.1c1.4-3 3.5-4.8 6.4-5.5.8 3.7-.1 6.7-2.8 8.9"/></svg>
        </span>
        <span>
          <strong>FitMeal</strong>
          <small>轻食令</small>
        </span>
      </a>
      <div class="topbar-actions">
        <a class="data-entry-link" href="./data.html">数据录入</a>
        <a class="data-entry-link" href="./overview.html">数据总览</a>
        <div class="service-state" id="serviceState">
          <span class="state-dot" aria-hidden="true"></span>
          <span>正在连接本地服务</span>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="input-panel" aria-labelledby="inputTitle">
        <div class="eyebrow">今天这一餐</div>
        <h1 id="inputTitle">直接说出需求，让系统来完成判断。</h1>
        <p class="lead">用一句话说明现有食材、目标、时间和忌口。页面只发送自然语言，由服务端完成理解、匹配和生成。</p>

        <div class="sample-row" aria-label="示例输入">
          <button class="sample-button" type="button" data-sample="cook">自烹饪</button>
          <button class="sample-button" type="button" data-sample="eat_out">外食</button>
          <button class="sample-button" type="button" data-sample="substitute">替换</button>
          <button class="sample-button" type="button" data-sample="nutrition">营养</button>
          <button class="sample-button" type="button" data-sample="safety">安全拦截</button>
        </div>

        <form id="mealForm" novalidate>
          <label class="field field-wide">
            <span>一句话描述</span>
            <textarea id="userInput" rows="5" required placeholder="例：我有鸡胸肉、西兰花和鸡蛋，减脂，想 20 分钟内做完，口味清淡一点。"></textarea>
          </label>

          <button class="primary-button" id="submitButton" type="submit">
            <span>生成建议</span>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4"/></svg>
          </button>
          <p class="form-note">页面只发送这段自然语言，服务端负责匹配数据并生成建议。</p>
        </form>
      </section>

      <section class="result-panel" aria-live="polite" aria-busy="false" id="resultPanel">
        <div class="result-toolbar">
          <div>
            <div class="eyebrow">推荐结果</div>
            <h2 id="resultTitle">等待输入</h2>
          </div>
          <div class="result-meta" id="resultMeta"></div>
        </div>

        <div id="requestSummary" class="request-summary" hidden></div>
        <div id="results" class="results">
          <div class="empty-state">
            <div class="empty-illustration" aria-hidden="true">
              <span class="plate"></span>
              <span class="leaf leaf-a"></span>
              <span class="leaf leaf-b"></span>
            </div>
            <h3>先告诉系统这顿饭的边界</h3>
            <p>可以直接输入，也可以点上方示例。结果会标注真实链路和完整耗时。</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <template id="loadingTemplate">
    <div class="loading-state">
      <div class="loading-mark"><span></span><span></span><span></span></div>
      <p>系统正在理解需求、读取数据并生成建议...</p>
      <small>完整链路通常需要 20 至 40 秒</small>
    </div>
  </template>

  <script src="./app.js?v=0.5.2" defer></script>
</body>
</html>
